name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.adoc'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.adoc'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - mediawiki_version: '1.43'
            php_version: '8.3'
            database_type: mysql
            database_image: "mariadb:12.3"
            coverage: true
            experimental: false
          - mediawiki_version: '1.46'
            php_version: '8.4'
            database_type: mysql
            database_image: "mariadb:12.3"
            coverage: false
            experimental: false

    env:
      MW_VERSION: ${{ matrix.mediawiki_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      DB_TYPE: ${{ matrix.database_type }}
      DB_IMAGE: ${{ matrix.database_image }}
      PF_REPO: gesinn-it/mediawiki-extensions-PageForms
      PF_VERSION: '2.5.1'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run CI
        run: make ci
        if: matrix.coverage == false

      - name: Run CI with coverage
        run: mkdir -p build/coverage && make ci-coverage
        if: matrix.coverage == true

      - name: Run Phan
        if: matrix.coverage == true
        run: make composer-analyze

      - name: Upload coverage
        if: matrix.coverage == true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gesinn-it-pub/mediawiki-extensions-VEForAll
          files: build/coverage/php/coverage.xml,build/coverage/js/lcov.info
          disable_search: true
